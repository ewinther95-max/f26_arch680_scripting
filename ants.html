<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ant Colony</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #07080c;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false });
const pherCanvas = document.createElement("canvas");
const pherCtx = pherCanvas.getContext("2d", { alpha: true });

const CELL = 4;
const ANTS = 260;
const SENSOR_DIST = 22;
const SENSOR_ANGLE = 0.62;
const TURN = 0.48;
const SPEED = 1.25;
const NEST_R = 28;
const FOOD_R = 36;
const FOOD_START = 420;

let w = 0, h = 0, cols = 0, rows = 0, dpr = 1;
let foodPher, homePher, foodBuf, homeBuf;
let pherImage;
let nest, foods, ants;
let nestPulse = 0;

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function lerpAngle(a, b, t) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

function makePile(x, y, amount) {
  const bits = [];
  const n = 46;
  for (let i = 0; i < n; i++) {
    const a = i * 2.399963;
    const rad = 3 + Math.sqrt(i) * 4.4;
    bits.push({
      a,
      rad,
      s: 1.4 + (i % 5) * 0.45,
      warm: i % 3 === 0
    });
  }
  return { x, y, amount, max: Math.max(amount, 1), r: FOOD_R, bits };
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  w = window.innerWidth;
  h = window.innerHeight;
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const nextCols = Math.max(2, Math.ceil(w / CELL));
  const nextRows = Math.max(2, Math.ceil(h / CELL));
  const nextFood = new Float32Array(nextCols * nextRows);
  const nextHome = new Float32Array(nextCols * nextRows);

  if (foodPher && cols && rows) {
    const cw = Math.min(cols, nextCols);
    const rh = Math.min(rows, nextRows);
    for (let y = 0; y < rh; y++) {
      for (let x = 0; x < cw; x++) {
        nextFood[y * nextCols + x] = foodPher[y * cols + x];
        nextHome[y * nextCols + x] = homePher[y * cols + x];
      }
    }
  }

  cols = nextCols;
  rows = nextRows;
  foodPher = nextFood;
  homePher = nextHome;
  foodBuf = new Float32Array(cols * rows);
  homeBuf = new Float32Array(cols * rows);
  pherCanvas.width = cols;
  pherCanvas.height = rows;
  pherImage = pherCtx.createImageData(cols, rows);

  if (!nest) {
    nest = { x: w * 0.5, y: h * 0.52, r: NEST_R };
    foods = [
      makePile(w * 0.22, h * 0.28, FOOD_START),
      makePile(w * 0.76, h * 0.7, FOOD_START)
    ];
    ants = [];
    for (let i = 0; i < ANTS; i++) {
      const a = Math.random() * Math.PI * 2;
      const rad = Math.random() * nest.r * 0.7;
      ants.push({
        x: nest.x + Math.cos(a) * rad,
        y: nest.y + Math.sin(a) * rad,
        angle: a,
        carrying: false
      });
    }
  } else {
    nest.x = clamp(nest.x, 40, w - 40);
    nest.y = clamp(nest.y, 40, h - 40);
    for (const f of foods) {
      f.x = clamp(f.x, 20, w - 20);
      f.y = clamp(f.y, 20, h - 20);
    }
    for (const ant of ants) {
      ant.x = clamp(ant.x, 2, w - 2);
      ant.y = clamp(ant.y, 2, h - 2);
    }
  }
}

function sample(grid, x, y) {
  const fx = x / CELL - 0.5;
  const fy = y / CELL - 0.5;
  const x0 = Math.floor(fx);
  const y0 = Math.floor(fy);
  const tx = fx - x0;
  const ty = fy - y0;
  let acc = 0;
  const x1 = x0 + 1;
  const y1 = y0 + 1;
  if (x0 >= 0 && y0 >= 0 && x0 < cols && y0 < rows) acc += grid[y0 * cols + x0] * (1 - tx) * (1 - ty);
  if (x1 >= 0 && y0 >= 0 && x1 < cols && y0 < rows) acc += grid[y0 * cols + x1] * tx * (1 - ty);
  if (x0 >= 0 && y1 >= 0 && x0 < cols && y1 < rows) acc += grid[y1 * cols + x0] * (1 - tx) * ty;
  if (x1 >= 0 && y1 >= 0 && x1 < cols && y1 < rows) acc += grid[y1 * cols + x1] * tx * ty;
  return acc;
}

function deposit(grid, x, y, amount) {
  const cx = x / CELL;
  const cy = y / CELL;
  for (let oy = -1; oy <= 1; oy++) {
    for (let ox = -1; ox <= 1; ox++) {
      const ix = (cx + ox) | 0;
      const iy = (cy + oy) | 0;
      if (ix < 0 || iy < 0 || ix >= cols || iy >= rows) continue;
      const falloff = (ox === 0 && oy === 0) ? 1 : 0.42;
      const i = iy * cols + ix;
      const v = grid[i] + amount * falloff;
      grid[i] = v > 48 ? 48 : v;
    }
  }
}

function evaporate(src, dst, keep) {
  for (let y = 0; y < rows; y++) {
    const yUp = y > 0 ? y - 1 : 0;
    const yDn = y < rows - 1 ? y + 1 : rows - 1;
    for (let x = 0; x < cols; x++) {
      const xLt = x > 0 ? x - 1 : 0;
      const xRt = x < cols - 1 ? x + 1 : cols - 1;
      const i = y * cols + x;
      const avg = (
        src[yUp * cols + xLt] + src[yUp * cols + x] + src[yUp * cols + xRt] +
        src[y * cols + xLt] + src[y * cols + xRt] +
        src[yDn * cols + xLt] + src[yDn * cols + x] + src[yDn * cols + xRt]
      ) * 0.125;
      const v = (src[i] * 0.62 + avg * 0.38) * keep;
      dst[i] = v < 0.02 ? 0 : v;
    }
  }
}

function steer(ant, grid, wander) {
  const a = ant.angle;
  const left = sample(grid, ant.x + Math.cos(a - SENSOR_ANGLE) * SENSOR_DIST, ant.y + Math.sin(a - SENSOR_ANGLE) * SENSOR_DIST);
  const center = sample(grid, ant.x + Math.cos(a) * SENSOR_DIST, ant.y + Math.sin(a) * SENSOR_DIST);
  const right = sample(grid, ant.x + Math.cos(a + SENSOR_ANGLE) * SENSOR_DIST, ant.y + Math.sin(a + SENSOR_ANGLE) * SENSOR_DIST);
  const signal = left > center ? (left > right ? left : right) : (center > right ? center : right);

  if (signal < 0.15) {
    ant.angle += (Math.random() - 0.5) * wander;
    return;
  }
  if (center >= left && center >= right) {
    ant.angle += (Math.random() - 0.5) * 0.08;
  } else if (left > right) {
    ant.angle -= TURN;
  } else if (right > left) {
    ant.angle += TURN;
  } else {
    ant.angle += Math.random() < 0.5 ? TURN : -TURN;
  }
}

function stepAnt(ant) {
  if (ant.carrying) {
    const home = Math.atan2(nest.y - ant.y, nest.x - ant.x);
    ant.angle = lerpAngle(ant.angle, home, 0.22);
    ant.angle += (Math.random() - 0.5) * 0.18;
  } else {
    steer(ant, foodPher, 0.85);
  }

  ant.x += Math.cos(ant.angle) * SPEED;
  ant.y += Math.sin(ant.angle) * SPEED;

  if (ant.x < 1) { ant.x = 1; ant.angle = Math.PI - ant.angle; }
  else if (ant.x > w - 1) { ant.x = w - 1; ant.angle = Math.PI - ant.angle; }
  if (ant.y < 1) { ant.y = 1; ant.angle = -ant.angle; }
  else if (ant.y > h - 1) { ant.y = h - 1; ant.angle = -ant.angle; }

  if (ant.carrying) {
    deposit(foodPher, ant.x, ant.y, 2.4);
    const dx = ant.x - nest.x;
    const dy = ant.y - nest.y;
    if (dx * dx + dy * dy < nest.r * nest.r) {
      ant.carrying = false;
      ant.angle = Math.random() * Math.PI * 2;
      nestPulse = 1;
    }
  } else {
    deposit(homePher, ant.x, ant.y, 0.35);
    for (let i = 0; i < foods.length; i++) {
      const f = foods[i];
      if (f.amount <= 0) continue;
      const dx = ant.x - f.x;
      const dy = ant.y - f.y;
      if (dx * dx + dy * dy < f.r * f.r) {
        f.amount -= 1;
        ant.carrying = true;
        ant.angle = Math.atan2(nest.y - ant.y, nest.x - ant.x) + (Math.random() - 0.5) * 0.5;
        break;
      }
    }
  }
}

function drawPheromone() {
  const data = pherImage.data;
  for (let i = 0; i < foodPher.length; i++) {
    const f = foodPher[i];
    const home = homePher[i];
    const o = i * 4;
    if (f < 0.02 && home < 0.08) {
      data[o] = 0; data[o + 1] = 0; data[o + 2] = 0; data[o + 3] = 0;
      continue;
    }
    const fg = f > 3.2 ? 1 : f * 0.3125;
    const hg = home > 14 ? 0.22 : home * 0.016;
    data[o] = Math.min(255, (fg * 255 + hg * 70) | 0);
    data[o + 1] = Math.min(255, (fg * 150 + hg * 110) | 0);
    data[o + 2] = Math.min(255, (fg * 40 + hg * 150) | 0);
    data[o + 3] = Math.min(255, (fg * 230 + hg * 90) | 0);
  }
  pherCtx.putImageData(pherImage, 0, 0);
  ctx.save();
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(pherCanvas, 0, 0, w, h);
  ctx.restore();
}

function drawNest() {
  const glow = ctx.createRadialGradient(nest.x, nest.y, nest.r * 0.4, nest.x, nest.y, nest.r * 2.6);
  glow.addColorStop(0, `rgba(196, 140, 72, ${0.28 + nestPulse * 0.35})`);
  glow.addColorStop(1, "rgba(196, 140, 72, 0)");
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(nest.x, nest.y, nest.r * 2.6, 0, Math.PI * 2);
  ctx.fill();

  const mound = ctx.createRadialGradient(nest.x - 6, nest.y - 8, 2, nest.x, nest.y, nest.r);
  mound.addColorStop(0, "#e6c48a");
  mound.addColorStop(0.55, "#a87848");
  mound.addColorStop(1, "#5c3d24");
  ctx.fillStyle = mound;
  ctx.beginPath();
  ctx.arc(nest.x, nest.y, nest.r, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#1a120c";
  ctx.beginPath();
  ctx.ellipse(nest.x, nest.y + 2, nest.r * 0.28, nest.r * 0.18, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawFood(f) {
  if (f.amount <= 0) return;
  const t = clamp(f.amount / f.max, 0, 1);
  const glow = ctx.createRadialGradient(f.x, f.y, 2, f.x, f.y, f.r * (0.55 + t));
  glow.addColorStop(0, `rgba(210, 196, 110, ${0.28 + t * 0.25})`);
  glow.addColorStop(1, "rgba(210, 196, 110, 0)");
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(f.x, f.y, f.r * (0.7 + t), 0, Math.PI * 2);
  ctx.fill();

  const n = Math.max(4, Math.ceil(f.bits.length * t));
  for (let i = 0; i < n; i++) {
    const bit = f.bits[i];
    const x = f.x + Math.cos(bit.a) * bit.rad * (0.35 + t * 0.65);
    const y = f.y + Math.sin(bit.a) * bit.rad * (0.35 + t * 0.65);
    ctx.fillStyle = bit.warm ? "#efe6a6" : "#c6d36a";
    ctx.beginPath();
    ctx.arc(x, y, bit.s * (0.65 + t * 0.5), 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawAnt(ant) {
  ctx.save();
  ctx.translate(ant.x, ant.y);
  ctx.rotate(ant.angle);
  ctx.fillStyle = ant.carrying ? "#f4edd4" : "#c9b48a";
  ctx.beginPath();
  ctx.ellipse(-0.4, 0, 3.1, 1.45, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(2.15, 0, 1.15, 0, Math.PI * 2);
  ctx.fill();
  if (ant.carrying) {
    ctx.fillStyle = "#d7e07a";
    ctx.fillRect(-1.2, -0.7, 1.5, 1.4);
  }
  ctx.restore();
}

function frame() {
  evaporate(foodPher, foodBuf, 0.996);
  evaporate(homePher, homeBuf, 0.99);
  let swap = foodPher; foodPher = foodBuf; foodBuf = swap;
  swap = homePher; homePher = homeBuf; homeBuf = swap;

  for (let i = 0; i < ants.length; i++) stepAnt(ants[i]);
  if (nestPulse > 0) nestPulse *= 0.94;

  const bg = ctx.createRadialGradient(w * 0.5, h * 0.48, Math.min(w, h) * 0.1, w * 0.5, h * 0.5, Math.max(w, h) * 0.72);
  bg.addColorStop(0, "#12141b");
  bg.addColorStop(1, "#05060a");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  drawPheromone();
  drawNest();
  for (let i = 0; i < foods.length; i++) drawFood(foods[i]);
  for (let i = 0; i < ants.length; i++) drawAnt(ants[i]);

  requestAnimationFrame(frame);
}

canvas.addEventListener("pointerdown", (e) => {
  const x = e.clientX;
  const y = e.clientY;
  for (let i = 0; i < foods.length; i++) {
    const f = foods[i];
    const dx = x - f.x;
    const dy = y - f.y;
    if (dx * dx + dy * dy < (f.r + 18) * (f.r + 18)) {
      f.amount += 160;
      f.max = Math.max(f.max, f.amount);
      return;
    }
  }
  foods.push(makePile(x, y, 200));
});

window.addEventListener("resize", resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
