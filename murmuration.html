<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murmuration</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #b7b3ac;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2", { antialias: true, alpha: false, powerPreference: "high-performance" });
if (!gl) throw new Error("WebGL2 required");

const CYCLE = 64;
const MAX_BIRDS = 5600;
const MAX_SPEED = 7.4;
const CELL = 2.15;
const HASH = 16384;
const MASK = HASH - 1;

const DECK_Y = 5.55;
const DECK_HALF = 1.16;
const DECK_THICK = 0.07;

let width = 1, height = 1, dpr = 1;
let time = 0;

const sx = new Float32Array(360);
const sy = new Float32Array(360);
const sz = new Float32Array(360);
const stx = new Float32Array(360);
const stz = new Float32Array(360);
const snx = new Float32Array(360);
const snz = new Float32Array(360);
const SAMPLES = sx.length;

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smoother(edge0, edge1, x) {
  const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
  return t * t * t * (t * (t * 6 - 15) + 10);
}
function rnd(n) {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
  return x - Math.floor(x);
}

function pathRaw(u) {
  const x = (u - 0.5) * 74;
  const z = Math.sin(u * Math.PI * 2) * 17 + Math.sin(u * Math.PI * 3) * 2.4;
  return [x, DECK_Y, z];
}

function buildPath() {
  for (let i = 0; i < SAMPLES; i++) {
    const p = pathRaw(i / (SAMPLES - 1));
    sx[i] = p[0];
    sy[i] = p[1];
    sz[i] = p[2];
  }
  let nx = 0, nz = 1;
  for (let i = 0; i < SAMPLES; i++) {
    const i0 = Math.max(0, i - 1);
    const i1 = Math.min(SAMPLES - 1, i + 1);
    let tx = sx[i1] - sx[i0];
    let tz = sz[i1] - sz[i0];
    const tl = Math.hypot(tx, tz) || 1;
    tx /= tl;
    tz /= tl;
    const d = nx * tx + nz * tz;
    nx -= tx * d;
    nz -= tz * d;
    let nl = Math.hypot(nx, nz);
    if (nl < 1e-5) {
      nx = -tz;
      nz = tx;
      nl = Math.hypot(nx, nz) || 1;
    }
    nx /= nl;
    nz /= nl;
    stx[i] = tx;
    stz[i] = tz;
    snx[i] = nx;
    snz[i] = nz;
  }
}

function frame(u) {
  const f = clamp(u, 0, 1) * (SAMPLES - 1);
  const i = Math.min(SAMPLES - 2, f | 0);
  const t = f - i;
  const a = 1 - t;
  let nx = snx[i] * a + snx[i + 1] * t;
  let nz = snz[i] * a + snz[i + 1] * t;
  let tx = stx[i] * a + stx[i + 1] * t;
  let tz = stz[i] * a + stz[i + 1] * t;
  const nl = Math.hypot(nx, nz) || 1;
  const tl = Math.hypot(tx, tz) || 1;
  return {
    x: sx[i] * a + sx[i + 1] * t,
    y: sy[i] * a + sy[i + 1] * t,
    z: sz[i] * a + sz[i + 1] * t,
    nx: nx / nl,
    nz: nz / nl,
    tx: tx / tl,
    tz: tz / tl
  };
}

const columns = [];
function buildColumns() {
  let acc = 0;
  let prev = pathRaw(0);
  columns.push(0.015);
  for (let i = 1; i <= 240; i++) {
    const u = i / 240;
    const p = pathRaw(u);
    acc += Math.hypot(p[0] - prev[0], p[2] - prev[2]);
    if (acc >= 7.6) {
      columns.push(u);
      acc = 0;
    }
    prev = p;
  }
}

const tx = new Float32Array(MAX_BIRDS);
const ty = new Float32Array(MAX_BIRDS);
const tz = new Float32Array(MAX_BIRDS);
const tnx = new Float32Array(MAX_BIRDS);
const tnz = new Float32Array(MAX_BIRDS);
const ttx = new Float32Array(MAX_BIRDS);
const ttz = new Float32Array(MAX_BIRDS);
const tamp = new Float32Array(MAX_BIRDS);
const tphase = new Float32Array(MAX_BIRDS);
const tup = new Float32Array(MAX_BIRDS);
let N = 0;
let seed = 1;
function r() { seed += 1; return rnd(seed); }

const placeGrid = new Map();
function placeKey(x, y, z) {
  const ix = Math.floor(x / 0.42);
  const iy = Math.floor(y / 0.42);
  const iz = Math.floor(z / 0.42);
  return ix * 83492791 + iy * 19349663 + iz * 73856093;
}
function tooClose(x, y, z, minD) {
  const r2 = minD * minD;
  const ix = Math.floor(x / 0.42);
  const iy = Math.floor(y / 0.42);
  const iz = Math.floor(z / 0.42);
  for (let oz = -1; oz <= 1; oz++) {
    for (let oy = -1; oy <= 1; oy++) {
      for (let ox = -1; ox <= 1; ox++) {
        const list = placeGrid.get((ix + ox) * 83492791 + (iy + oy) * 19349663 + (iz + oz) * 73856093);
        if (!list) continue;
        for (let k = 0; k < list.length; k++) {
          const j = list[k];
          const dx = tx[j] - x, dy = ty[j] - y, dz = tz[j] - z;
          if (dx * dx + dy * dy + dz * dz < r2) return true;
        }
      }
    }
  }
  return false;
}
function place(x, y, z, nx, nz, tangentX, tangentZ, amp, upBias, minD) {
  if (N >= MAX_BIRDS) return false;
  if (y < 0.55 || y > 16) return false;
  if (tooClose(x, y, z, minD)) return false;
  const i = N++;
  tx[i] = x; ty[i] = y; tz[i] = z;
  tnx[i] = nx; tnz[i] = nz;
  ttx[i] = tangentX; ttz[i] = tangentZ;
  tamp[i] = amp;
  tup[i] = upBias;
  tphase[i] = r() * Math.PI * 2;
  const key = placeKey(x, y, z);
  let list = placeGrid.get(key);
  if (!list) { list = []; placeGrid.set(key, list); }
  list.push(i);
  return true;
}

function buildEnvelope() {
  function bayCanopy(u0, u1, budget) {
    const uSteps = 34;
    const aSteps = 18;
    let placed = 0;
    for (let layer = 0; layer < 2 && placed < budget; layer++) {
      for (let iu = 0; iu < uSteps && placed < budget; iu++) {
        for (let ia = 0; ia < aSteps && placed < budget; ia++) {
          const fu = (iu + r() * 0.65) / uSteps;
          const u = lerp(u0, u1, fu);
          if (r() < 0.05) continue;
          const arch = (ia + r() * 0.35) / aSteps;
          const ang = Math.PI * (0.08 + 0.84 * arch);
          const belly = Math.sin(fu * Math.PI);
          const span = (2.15 + layer * 0.28) * (0.82 + 0.28 * belly);
          const rise = (2.6 + layer * 0.35) * (0.72 + 0.55 * belly) * (0.9 + r() * 0.18);
          const p = frame(u);
          const lat = Math.cos(ang) * span;
          let y = p.y + Math.sin(ang) * rise;
          if (y < p.y + 0.2) y = p.y + 0.2 + r() * 0.08;
          const x = p.x + p.nx * lat;
          const z = p.z + p.nz * lat;
          if (place(x, y, z, p.nx, p.nz, p.tx, p.tz, 0.55, 1, 0.28)) placed++;
        }
      }
    }
  }

  function volume(u0, u1, side, height, budget) {
    let placed = 0;
    const uSteps = 22;
    const lSteps = 8;
    const ySteps = 9;
    for (let iu = 0; iu < uSteps && placed < budget; iu++) {
      for (let il = 0; il < lSteps && placed < budget; il++) {
        for (let iy = 0; iy < ySteps && placed < budget; iy++) {
          if (r() < 0.2) continue;
          const fu = (iu + r()) / uSteps;
          const u = lerp(u0, u1, fu);
          const lat = side * lerp(1.45, 4.05, (il + r()) / lSteps);
          const hNoise = 0.45 + 0.55 * Math.abs(Math.sin(u * 28 + il));
          const y = DECK_Y + 0.08 + ((iy + r()) / ySteps) * height * hNoise;
          if (Math.abs(lat) < 1.35 && y < DECK_Y + 2.35) continue;
          const voidU = (u0 + u1) * 0.5;
          const p = frame(u);
          const cx = p.x + p.nx * side * 2.6;
          const cz = p.z + p.nz * side * 2.6;
          const cy = DECK_Y + height * 0.48;
          const dx = p.x + p.nx * lat - cx;
          const dy = y - cy;
          const dz = p.z + p.nz * lat - cz;
          if (dx * dx + dy * dy * 0.7 + dz * dz < 1.15) continue;
          if (place(p.x + p.nx * lat, y, p.z + p.nz * lat, p.nx * side, p.nz * side, p.tx, p.tz, 0.26, 0.25, 0.4)) placed++;
        }
      }
    }
    for (let iu = 0; iu < 36 && placed < budget; iu++) {
      const u = lerp(u0, u1, (iu + r()) / 36);
      const p = frame(u);
      const lat = side * (1.28 + r() * 0.35);
      if (place(p.x + p.nx * lat, DECK_Y + 0.1 + r() * 0.12, p.z + p.nz * lat, p.nx * side, p.nz * side, p.tx, p.tz, 0.12, 0.05, 0.28)) placed++;
    }
  }

  function threshold(u, budget) {
    let placed = 0;
    const depth = 5;
    const postH = 14;
    for (let side = -1; side <= 1; side += 2) {
      for (let id = 0; id < depth && placed < budget; id++) {
        for (let ih = 0; ih < postH && placed < budget; ih++) {
          const uu = u + (id - (depth - 1) / 2) * 0.0045 + (r() - 0.5) * 0.002;
          const p = frame(uu);
          const lat = side * (1.62 + (r() - 0.5) * 0.28);
          const y = DECK_Y + 0.05 + (ih + r() * 0.4) / postH * 4.15;
          if (r() < 0.08) continue;
          if (place(p.x + p.nx * lat, y, p.z + p.nz * lat, p.nx, p.nz, p.tx, p.tz, 0.1, 0.15, 0.24)) placed++;
        }
      }
    }
    for (let id = 0; id < depth && placed < budget; id++) {
      for (let il = 0; il < 16 && placed < budget; il++) {
        const uu = u + (id - (depth - 1) / 2) * 0.0045;
        const p = frame(uu);
        const lat = lerp(-1.7, 1.7, (il + r()) / 16);
        const y = DECK_Y + 3.85 + (r() - 0.5) * 0.28 + id * 0.02;
        if (r() < 0.12) continue;
        if (place(p.x + p.nx * lat, y, p.z + p.nz * lat, p.nx, p.nz, p.tx, p.tz, 0.1, 0.4, 0.24)) placed++;
      }
    }
  }

  function hanging(u, budget) {
    let placed = 0;
    const shells = 220;
    for (let i = 0; i < shells && placed < budget; i++) {
      const ang = r() * Math.PI * 2;
      const rad = Math.pow(r(), 0.55) * (1.15 + r() * 1.35);
      const down = Math.pow(r(), 0.62) * 3.15;
      if (r() < 0.12) continue;
      const uu = u + (r() - 0.5) * 0.045;
      const p = frame(uu);
      const x = p.x + p.nx * Math.cos(ang) * rad;
      const z = p.z + p.nz * Math.cos(ang) * rad + p.tx * Math.sin(ang) * rad * 0.85;
      const y = DECK_Y - DECK_THICK - 0.08 - down;
      if (y < 1.05) continue;
      if (place(x, y, z, p.nx, p.nz, p.tx, p.tz, 0.48, -1, 0.36)) placed++;
    }
  }

  bayCanopy(0.1, 0.3, 520);
  bayCanopy(0.4, 0.58, 560);
  bayCanopy(0.66, 0.9, 540);
  threshold(0.3, 420);
  threshold(0.5, 280);
  threshold(0.64, 260);
  threshold(0.84, 240);
  hanging(0.2, 280);
  hanging(0.46, 300);
  hanging(0.74, 280);
  volume(0.14, 0.3, -1, 3.6, 520);
  volume(0.42, 0.57, 1, 2.5, 420);
  volume(0.68, 0.86, -1, 4.1, 480);
  volume(0.7, 0.84, 1, 2.2, 320);
}

const px = new Float32Array(MAX_BIRDS);
const py = new Float32Array(MAX_BIRDS);
const pz = new Float32Array(MAX_BIRDS);
const vx = new Float32Array(MAX_BIRDS);
const vy = new Float32Array(MAX_BIRDS);
const vz = new Float32Array(MAX_BIRDS);
const hx = new Float32Array(MAX_BIRDS);
const hy = new Float32Array(MAX_BIRDS);
const hz = new Float32Array(MAX_BIRDS);
const shade = new Float32Array(MAX_BIRDS);
const scale = new Float32Array(MAX_BIRDS);
const stagger = new Float32Array(MAX_BIRDS);

function initBoids() {
  for (let i = 0; i < N; i++) {
    const ang = rnd(i + 3) * Math.PI * 2;
    const rad = 2 + Math.pow(rnd(i + 5), 0.55) * 14;
    px[i] = Math.cos(ang) * rad;
    py[i] = 12 + (rnd(i + 7) - 0.5) * 9;
    pz[i] = Math.sin(ang) * rad * 0.75;
    vx[i] = 5.2 + (rnd(i + 11) - 0.5) * 1.4;
    vy[i] = (rnd(i + 13) - 0.5) * 0.45;
    vz[i] = 1.1 + (rnd(i + 17) - 0.5) * 1.2;
    hx[i] = 1;
    hy[i] = 0;
    hz[i] = 0.15;
    shade[i] = 0.7 + rnd(i + 19) * 0.45;
    scale[i] = 0.18 + rnd(i + 23) * 0.12;
    stagger[i] = rnd(i + 29);
  }
}

let cenX = 0, cenY = 12, cenZ = 0;
let smX = 0, smY = 12, smZ = 0;

function pullOf(u) {
  const rise = smoother(0.07, 0.42, u);
  const fall = smoother(0.68, 0.9, u);
  return rise * (1 - fall);
}

function hashCell(ix, iy, iz) {
  return (Math.imul(ix, 73856093) ^ Math.imul(iy, 19349663) ^ Math.imul(iz, 83492791)) & MASK;
}

const heads = new Int32Array(HASH);
const next = new Int32Array(MAX_BIRDS);
const inst = new Float32Array(MAX_BIRDS * 8);
const predInst = new Float32Array(8);

function step(dt) {
  time += dt;
  const u = (time % CYCLE) / CYCLE;
  const pull = pullOf(u);
  const releasing = u > 0.68 && u < 0.92;
  const pulse = Math.sin(time * 0.82);
  const preferY = 11.5 + pulse * 2.8;

  const pa = time * 0.09;
  const predX = cenX + Math.cos(pa) * 11;
  const predY = preferY + Math.sin(pa * 0.7) * 2.4;
  const predZ = cenZ + Math.sin(pa) * 9;
  const fearR = lerp(16.5, 7.5, pull);
  const fearR2 = fearR * fearR;

  heads.fill(-1);
  for (let i = 0; i < N; i++) {
    const ix = Math.floor(px[i] / CELL);
    const iy = Math.floor(py[i] / CELL);
    const iz = Math.floor(pz[i] / CELL);
    const h = hashCell(ix, iy, iz);
    next[i] = heads[h];
    heads[h] = i;
  }

  let sxSum = 0, sySum = 0, szSum = 0;
  const flockAmt = (1 - pull) * (1 - pull * 0.25);

  for (let i = 0; i < N; i++) {
    const x = px[i], y = py[i], z = pz[i];
    const local = smoother(0, 1, (pull - stagger[i] * 0.2) / 0.8);
    let cx = 0, cy = 0, cz = 0, cn = 0;
    let ax = 0, ay = 0, az = 0, an = 0;
    let sepX = 0, sepY = 0, sepZ = 0;
    let seen = 0;
    const ix = Math.floor(x / CELL);
    const iy = Math.floor(y / CELL);
    const iz = Math.floor(z / CELL);
    for (let oz = -1; oz <= 1 && seen < 22; oz++) {
      for (let oy = -1; oy <= 1 && seen < 22; oy++) {
        for (let ox = -1; ox <= 1 && seen < 22; ox++) {
          let j = heads[hashCell(ix + ox, iy + oy, iz + oz)];
          while (j >= 0 && seen < 22) {
            if (j !== i) {
              const dx = px[j] - x, dy = py[j] - y, dz = pz[j] - z;
              const d2 = dx * dx + dy * dy + dz * dz;
              if (d2 > 1e-6 && d2 < 20) {
                seen++;
                if (d2 < 18) {
                  cn++;
                  cx += px[j]; cy += py[j]; cz += pz[j];
                }
                if (d2 < 8) {
                  an++;
                  ax += vx[j]; ay += vy[j]; az += vz[j];
                }
                if (d2 < 0.42) {
                  const d = Math.sqrt(d2);
                  const w = (0.65 - d) / d;
                  sepX -= dx * w; sepY -= dy * w; sepZ -= dz * w;
                }
              }
            }
            j = next[j];
          }
        }
      }
    }

    let fx = 0, fy = 0, fz = 0;
    if (flockAmt > 0.02) {
      if (cn) {
        cx = cx / cn - x;
        cy = cy / cn - y;
        cz = cz / cn - z;
        const cl = Math.hypot(cx, cy, cz) || 1;
        const coh = 3.4 * (0.82 + 0.28 * pulse);
        fx += (cx / cl) * coh;
        fy += (cy / cl) * coh;
        fz += (cz / cl) * coh;
      }
      if (an) {
        ax = ax / an - vx[i];
        ay = ay / an - vy[i];
        az = az / an - vz[i];
        fx += ax * 4.4;
        fy += ay * 4.4;
        fz += az * 4.4;
      }
      fx += sepX * 5.5;
      fy += sepY * 5.5;
      fz += sepZ * 5.5;
      const ox = x - cenX;
      const oz = z - cenZ;
      const od = Math.hypot(ox, oz) || 1;
      const wantR = 9 + pulse * 3.2;
      if (od > wantR) {
        const pullIn = (od - wantR) * 0.55;
        fx += ((cenX - x) / od) * pullIn;
        fz += ((cenZ - z) / od) * pullIn;
      }
      fy += (preferY - y) * 1.05;
      fx += -x * 0.055;
      fz += -z * 0.055;
      fx += (-oz / od) * 0.28;
      fz += (ox / od) * 0.28;
      fx *= flockAmt;
      fy *= flockAmt;
      fz *= flockAmt;
    } else if (seen) {
      fx += sepX * 3.0;
      fy += sepY * 3.0;
      fz += sepZ * 3.0;
    }

    const wave = Math.sin(time * 0.5 + tphase[i]);
    const wave2 = Math.sin(time * 0.27 + tphase[i] * 1.4);
    const amp = tamp[i] * (0.35 + 0.65 * local);
    const gx = tx[i] + tnx[i] * amp * wave;
    const gy = ty[i] + tup[i] * amp * wave * 0.7 + amp * 0.18 * wave2;
    const gz = tz[i] + tnz[i] * amp * wave;
    let sdx = gx - x, sdy = gy - y, sdz = gz - z;
    const dist = Math.hypot(sdx, sdy, sdz);
    if (local > 0.001 && dist > 1e-4) {
      const arrive = clamp(dist / 5.5, 0.08, 1);
      const want = MAX_SPEED * arrive;
      const inv = want / dist;
      fx += (sdx * inv - vx[i]) * (3.2 + local * 4.5) * local;
      fy += (sdy * inv - vy[i]) * (3.2 + local * 4.5) * local;
      fz += (sdz * inv - vz[i]) * (3.2 + local * 4.5) * local;
    }

    const pdx = x - predX, pdy = y - predY, pdz = z - predZ;
    const pd2 = pdx * pdx + pdy * pdy + pdz * pdz;
    if (pd2 < fearR2 && pd2 > 1e-4) {
      const pd = Math.sqrt(pd2);
      const fear = (1 - pd / fearR);
      const mag = fear * fear * lerp(34, 16, local);
      fx += (pdx / pd) * mag;
      fy += (pdy / pd) * mag * 0.65;
      fz += (pdz / pd) * mag;
    }

    if (releasing) fy += 8.5 * (1 - pull);
    if (flockAmt > 0.45 && y < 7.2) fy += (7.2 - y) * 4.5;
    if (y < 0.7) fy += (0.7 - y) * 18;

    const fl = Math.hypot(fx, fy, fz);
    if (fl > 42) {
      const s = 42 / fl;
      fx *= s; fy *= s; fz *= s;
    }

    vx[i] += fx * dt;
    vy[i] += fy * dt;
    vz[i] += fz * dt;
    const sp = Math.hypot(vx[i], vy[i], vz[i]);
    const limit = lerp(MAX_SPEED, Math.max(0.55, dist * 1.35), local);
    if (sp > limit) {
      const s = limit / sp;
      vx[i] *= s; vy[i] *= s; vz[i] *= s;
    }
    if (local > 0.65) {
      const damp = lerp(1, 0.9, (local - 0.65) / 0.35);
      vx[i] *= damp; vy[i] *= damp; vz[i] *= damp;
    }

    px[i] += vx[i] * dt;
    py[i] += vy[i] * dt;
    pz[i] += vz[i] * dt;

    let dx = vx[i], dy = vy[i], dz = vz[i];
    const spd = Math.hypot(dx, dy, dz);
    if (spd > 0.45 && local < 0.72) {
      dx /= spd; dy /= spd; dz /= spd;
    } else {
      dx = ttx[i]; dy = 0.02; dz = ttz[i];
    }
    const blend = Math.min(1, dt * 5);
    hx[i] = hx[i] * (1 - blend) + dx * blend;
    hy[i] = hy[i] * (1 - blend) + dy * blend;
    hz[i] = hz[i] * (1 - blend) + dz * blend;
    const hl = Math.hypot(hx[i], hy[i], hz[i]) || 1;
    hx[i] /= hl; hy[i] /= hl; hz[i] /= hl;

    const o = i * 8;
    inst[o] = px[i];
    inst[o + 1] = py[i];
    inst[o + 2] = pz[i];
    inst[o + 3] = hx[i];
    inst[o + 4] = hy[i];
    inst[o + 5] = hz[i];
    inst[o + 6] = shade[i];
    inst[o + 7] = scale[i];
    sxSum += px[i]; sySum += py[i]; szSum += pz[i];
  }

  cenX = sxSum / N;
  cenY = sySum / N;
  cenZ = szSum / N;
  const k = 1 - Math.exp(-dt * 1.4);
  smX += (cenX - smX) * k;
  smY += (cenY - smY) * k;
  smZ += (cenZ - smZ) * k;

  const pvx = -Math.sin(pa) * 15 * 0.078;
  const pvz = Math.cos(pa * 0.91) * 13 * 0.078;
  const plen = Math.hypot(pvx, pvz) || 1;
  predInst[0] = predX;
  predInst[1] = predY;
  predInst[2] = predZ;
  predInst[3] = pvx / plen;
  predInst[4] = 0;
  predInst[5] = pvz / plen;
  predInst[6] = 0.25;
  predInst[7] = 1.9;
}

function compile(type, src) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, src);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(shader) + "\n" + src);
  }
  return shader;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

const skyProg = program(`#version 300 es
layout(location=0) in vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.999, 1.0); }
`, `#version 300 es
precision highp float;
uniform vec2 u_res;
out vec4 fragColor;
void main() {
  float h = gl_FragCoord.y / u_res.y;
  vec3 hor = vec3(0.78, 0.76, 0.72);
  vec3 top = vec3(0.55, 0.60, 0.64);
  float g = smoothstep(0.0, 0.62, h);
  fragColor = vec4(mix(hor, top, g), 1.0);
}`);

const litProg = program(`#version 300 es
precision highp float;
layout(location=0) in vec3 a_pos;
layout(location=1) in vec3 a_nrm;
layout(location=2) in vec3 a_col;
uniform mat4 u_vp;
uniform vec3 u_cam;
out vec3 v_col;
out vec3 v_nrm;
out vec3 v_world;
void main() {
  v_world = a_pos;
  v_nrm = a_nrm;
  v_col = a_col;
  gl_Position = u_vp * vec4(a_pos, 1.0);
}
`, `#version 300 es
precision highp float;
in vec3 v_col;
in vec3 v_nrm;
in vec3 v_world;
uniform vec3 u_cam;
uniform vec3 u_light;
uniform vec3 u_fog;
out vec4 fragColor;
void main() {
  float ndl = abs(dot(normalize(v_nrm), u_light));
  vec3 col = v_col * (0.64 + 0.36 * ndl);
  float dist = length(u_cam - v_world);
  col = mix(col, u_fog, smoothstep(48.0, 155.0, dist));
  fragColor = vec4(col, 1.0);
}`);

const groundProg = program(`#version 300 es
precision highp float;
layout(location=0) in vec2 a_xz;
uniform mat4 u_vp;
uniform vec3 u_cam;
out vec3 v_world;
void main() {
  v_world = vec3(a_xz.x, 0.0, a_xz.y);
  gl_Position = u_vp * vec4(v_world, 1.0);
}
`, `#version 300 es
precision highp float;
in vec3 v_world;
uniform vec3 u_cam;
uniform vec3 u_fog;
uniform vec2 u_path[48];
uniform vec2 u_cols[40];
uniform int u_colN;
out vec4 fragColor;
void main() {
  vec3 col = vec3(0.58, 0.56, 0.52);
  float best = 64.0;
  for (int i = 0; i < 48; i++) {
    vec2 d = v_world.xz - u_path[i];
    best = min(best, dot(d, d));
  }
  col *= mix(0.74, 1.0, smoothstep(0.9, 9.0, best));
  for (int i = 0; i < 40; i++) {
    if (i >= u_colN) break;
    float d = length(v_world.xz - u_cols[i]);
    col *= mix(0.68, 1.0, smoothstep(0.12, 3.1, d));
  }
  float dist = length(u_cam - v_world);
  col = mix(col, u_fog, smoothstep(42.0, 150.0, dist));
  fragColor = vec4(col, 1.0);
}`);

const birdProg = program(`#version 300 es
precision highp float;
layout(location=0) in vec3 a_pos;
layout(location=1) in vec3 i_pos;
layout(location=2) in vec3 i_fwd;
layout(location=3) in float i_shade;
layout(location=4) in float i_scale;
uniform mat4 u_vp;
out vec3 v_world;
out vec3 v_nrm;
out float v_shade;
void main() {
  vec3 fwd = normalize(i_fwd);
  vec3 right = cross(vec3(0.0, 1.0, 0.0), fwd);
  float rl = length(right);
  right = rl < 0.0001 ? vec3(1.0, 0.0, 0.0) : right / rl;
  vec3 up = cross(fwd, right);
  vec3 world = i_pos + (right * a_pos.x + up * a_pos.y + fwd * a_pos.z) * i_scale;
  v_world = world;
  v_nrm = up;
  v_shade = i_shade;
  gl_Position = u_vp * vec4(world, 1.0);
}
`, `#version 300 es
precision highp float;
in vec3 v_world;
in vec3 v_nrm;
in float v_shade;
uniform vec3 u_cam;
uniform vec3 u_fog;
uniform vec3 u_color;
out vec4 fragColor;
void main() {
  vec3 V = normalize(u_cam - v_world);
  float ndv = abs(dot(normalize(v_nrm), V));
  float rim = pow(1.0 - ndv, 2.0);
  vec3 col = u_color * mix(0.78, 1.2, clamp(v_shade, 0.0, 1.0));
  col += vec3(0.16, 0.15, 0.14) * rim * 0.28;
  float dist = length(u_cam - v_world);
  col = mix(col, u_fog, smoothstep(55.0, 160.0, dist));
  fragColor = vec4(col, 1.0);
}`);

function buffer(target, data, usage) {
  const b = gl.createBuffer();
  gl.bindBuffer(target, b);
  gl.bufferData(target, data, usage || gl.STATIC_DRAW);
  return b;
}

const skyBuf = buffer(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]));

function buildStructure() {
  const v = [];
  const idx = [];
  function face(verts, n, col) {
    const b = v.length / 9;
    for (let k = 0; k < 4; k++) v.push(verts[k * 3], verts[k * 3 + 1], verts[k * 3 + 2], n[0], n[1], n[2], col[0], col[1], col[2]);
    idx.push(b, b + 1, b + 2, b, b + 2, b + 3);
  }
  function addBox(cx, cy, cz, sx, sy, sz, col) {
    const x0 = cx - sx, x1 = cx + sx, y0 = cy - sy, y1 = cy + sy, z0 = cz - sz, z1 = cz + sz;
    face([x0, y1, z1, x1, y1, z1, x1, y1, z0, x0, y1, z0], [0, 1, 0], col);
    face([x0, y0, z0, x1, y0, z0, x1, y0, z1, x0, y0, z1], [0, -1, 0], col);
    face([x0, y0, z1, x1, y0, z1, x1, y1, z1, x0, y1, z1], [0, 0, 1], col);
    face([x1, y0, z0, x0, y0, z0, x0, y1, z0, x1, y1, z0], [0, 0, -1], col);
    face([x1, y0, z1, x1, y0, z0, x1, y1, z0, x1, y1, z1], [1, 0, 0], col);
    face([x0, y0, z0, x0, y0, z1, x0, y1, z1, x0, y1, z0], [-1, 0, 0], col);
  }

  const deckTop = [0.91, 0.89, 0.85];
  const deckBot = [0.70, 0.67, 0.62];
  const deckSide = [0.78, 0.75, 0.70];
  const SEG = 200;
  const base = 0;
  for (let i = 0; i <= SEG; i++) {
    const p = frame(i / SEG);
    const hw = DECK_HALF;
    const y1 = p.y;
    const y0 = p.y - DECK_THICK;
    v.push(
      p.x + p.nx * hw, y1, p.z + p.nz * hw, 0, 1, 0, deckTop[0], deckTop[1], deckTop[2],
      p.x - p.nx * hw, y1, p.z - p.nz * hw, 0, 1, 0, deckTop[0], deckTop[1], deckTop[2],
      p.x + p.nx * hw, y0, p.z + p.nz * hw, 0, -1, 0, deckBot[0], deckBot[1], deckBot[2],
      p.x - p.nx * hw, y0, p.z - p.nz * hw, 0, -1, 0, deckBot[0], deckBot[1], deckBot[2]
    );
  }
  for (let i = 0; i < SEG; i++) {
    const a = base + i * 4;
    const b = a + 4;
    idx.push(a, b, b + 1, a, b + 1, a + 1);
    idx.push(a + 3, b + 2, a + 2, a + 3, b + 3, b + 2);
    idx.push(a, a + 1, b + 1, a, b + 1, b);
    idx.push(a + 2, b + 2, b + 3, a + 2, b + 3, a + 3);
    idx.push(a, b, b + 2, a, b + 2, a + 2);
    idx.push(a + 1, a + 3, b + 3, a + 1, b + 3, b + 1);
  }

  const col = [0.16, 0.15, 0.14];
  const plate = [0.12, 0.11, 0.10];
  for (let i = 0; i < columns.length; i++) {
    const p = frame(columns[i]);
    const h = p.y - DECK_THICK;
    addBox(p.x, h * 0.5, p.z, 0.075, h * 0.5, 0.075, col);
    addBox(p.x, 0.025, p.z, 0.28, 0.025, 0.28, plate);
  }

  const verts = new Float32Array(v);
  const indices = new Uint32Array(idx);
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  buffer(gl.ARRAY_BUFFER, verts);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 36, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 36, 12);
  gl.enableVertexAttribArray(2);
  gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 36, 24);
  const ib = buffer(gl.ELEMENT_ARRAY_BUFFER, indices);
  gl.bindVertexArray(null);
  return { vao, count: indices.length, ib };
}

const groundBuf = buffer(gl.ARRAY_BUFFER, new Float32Array([
  -240, -240, 240, -240, 240, 240,
  -240, -240, 240, 240, -240, 240
]));

const birdGeom = buffer(gl.ARRAY_BUFFER, new Float32Array([
  0, 0, 0.62, 0.46, 0.01, -0.28, 0.05, 0.0, -0.04,
  0, 0, 0.62, -0.46, 0.01, -0.28, -0.05, 0.0, -0.04
]));
const instBuf = buffer(gl.ARRAY_BUFFER, inst.subarray(0, MAX_BIRDS * 8), gl.DYNAMIC_DRAW);
const predBuf = buffer(gl.ARRAY_BUFFER, predInst, gl.DYNAMIC_DRAW);

function makeBirdVAO(instanceBuffer) {
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, birdGeom);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, instanceBuffer);
  const stride = 32;
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, stride, 0);
  gl.vertexAttribDivisor(1, 1);
  gl.enableVertexAttribArray(2);
  gl.vertexAttribPointer(2, 3, gl.FLOAT, false, stride, 12);
  gl.vertexAttribDivisor(2, 1);
  gl.enableVertexAttribArray(3);
  gl.vertexAttribPointer(3, 1, gl.FLOAT, false, stride, 24);
  gl.vertexAttribDivisor(3, 1);
  gl.enableVertexAttribArray(4);
  gl.vertexAttribPointer(4, 1, gl.FLOAT, false, stride, 28);
  gl.vertexAttribDivisor(4, 1);
  gl.bindVertexArray(null);
  return vao;
}
const birdVAO = makeBirdVAO(instBuf);
const predVAO = makeBirdVAO(predBuf);

buildPath();
buildColumns();
buildEnvelope();
initBoids();
const structure = buildStructure();

const pathPts = new Float32Array(48 * 2);
for (let i = 0; i < 48; i++) {
  const p = frame((i + 0.5) / 48);
  pathPts[i * 2] = p.x;
  pathPts[i * 2 + 1] = p.z;
}
const colPts = new Float32Array(40 * 2);
const colN = Math.min(40, columns.length);
for (let i = 0; i < colN; i++) {
  const p = frame(columns[i]);
  colPts[i * 2] = p.x;
  colPts[i * 2 + 1] = p.z;
}

const vp = new Float32Array(16);
const view = new Float32Array(16);
const proj = new Float32Array(16);

function perspective(out, fov, aspect, near, far) {
  const f = 1 / Math.tan(fov / 2);
  const nf = 1 / (near - far);
  out.fill(0);
  out[0] = f / aspect;
  out[5] = f;
  out[10] = (far + near) * nf;
  out[11] = -1;
  out[14] = 2 * far * near * nf;
}
function lookAt(out, ex, ey, ez, tx0, ty0, tz0) {
  let zx = ex - tx0, zy = ey - ty0, zz = ez - tz0;
  let zl = Math.hypot(zx, zy, zz) || 1;
  zx /= zl; zy /= zl; zz /= zl;
  let xx = zz, xy = 0, xz = -zx;
  const xl = Math.hypot(xx, xy, xz) || 1;
  xx /= xl; xy /= xl; xz /= xl;
  const yx = zy * xz - zz * xy;
  const yy = zz * xx - zx * xz;
  const yz = zx * xy - zy * xx;
  out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
  out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
  out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
  out[12] = -(xx * ex + xy * ey + xz * ez);
  out[13] = -(yx * ex + yy * ey + yz * ez);
  out[14] = -(zx * ex + zy * ey + zz * ez);
  out[15] = 1;
}
function multiply(out, a, b) {
  for (let c = 0; c < 4; c++) {
    for (let r = 0; r < 4; r++) {
      out[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
    }
  }
}

const fog = [0.78, 0.76, 0.72];
const light = (() => {
  const x = 0.35, y = 0.86, z = 0.28;
  const l = Math.hypot(x, y, z);
  return [x / l, y / l, z / l];
})();

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 1.75);
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = Math.max(1, Math.floor(width * dpr));
  canvas.height = Math.max(1, Math.floor(height * dpr));
  gl.viewport(0, 0, canvas.width, canvas.height);
}

function camera(pull) {
  const ang = time * 0.032;
  const aerialEye = [Math.cos(ang) * 46 + smX * 0.35, 15, Math.sin(ang) * 36 + smZ * 0.35];
  const aerialLook = [smX * 0.7, 8.5, smZ * 0.7];
  const bay = frame(0.22);
  const archEye = [
    bay.x + bay.nx * 11,
    bay.y + 2.6,
    bay.z + bay.nz * 11
  ];
  const archLook = [
    bay.x,
    bay.y + 1.8,
    bay.z
  ];
  const ex = lerp(aerialEye[0], archEye[0], pull);
  const ey = lerp(aerialEye[1], archEye[1], pull);
  const ez = lerp(aerialEye[2], archEye[2], pull);
  const lx = lerp(aerialLook[0], archLook[0], pull);
  const ly = lerp(aerialLook[1], archLook[1], pull);
  const lz = lerp(aerialLook[2], archLook[2], pull);
  const fov = lerp(0.56, 0.78, pull);
  perspective(proj, fov, canvas.width / canvas.height, 0.15, 320);
  lookAt(view, ex, ey, ez, lx, ly, lz);
  multiply(vp, proj, view);
  return [ex, ey, ez];
}

function draw() {
  const pull = pullOf((time % CYCLE) / CYCLE);
  const cam = camera(pull);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.disable(gl.CULL_FACE);
  gl.clear(gl.DEPTH_BUFFER_BIT);

  gl.useProgram(skyProg);
  gl.uniform2f(gl.getUniformLocation(skyProg, "u_res"), canvas.width, canvas.height);
  gl.bindBuffer(gl.ARRAY_BUFFER, skyBuf);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.depthMask(false);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.depthMask(true);

  gl.useProgram(groundProg);
  gl.uniformMatrix4fv(gl.getUniformLocation(groundProg, "u_vp"), false, vp);
  gl.uniform3fv(gl.getUniformLocation(groundProg, "u_cam"), cam);
  gl.uniform3fv(gl.getUniformLocation(groundProg, "u_fog"), fog);
  gl.uniform2fv(gl.getUniformLocation(groundProg, "u_path"), pathPts);
  gl.uniform2fv(gl.getUniformLocation(groundProg, "u_cols"), colPts);
  gl.uniform1i(gl.getUniformLocation(groundProg, "u_colN"), colN);
  gl.bindBuffer(gl.ARRAY_BUFFER, groundBuf);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 6);

  gl.useProgram(litProg);
  gl.uniformMatrix4fv(gl.getUniformLocation(litProg, "u_vp"), false, vp);
  gl.uniform3fv(gl.getUniformLocation(litProg, "u_cam"), cam);
  gl.uniform3fv(gl.getUniformLocation(litProg, "u_light"), light);
  gl.uniform3fv(gl.getUniformLocation(litProg, "u_fog"), fog);
  gl.bindVertexArray(structure.vao);
  gl.drawElements(gl.TRIANGLES, structure.count, gl.UNSIGNED_INT, 0);
  gl.bindVertexArray(null);

  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, inst.subarray(0, N * 8));
  gl.useProgram(birdProg);
  gl.uniformMatrix4fv(gl.getUniformLocation(birdProg, "u_vp"), false, vp);
  gl.uniform3fv(gl.getUniformLocation(birdProg, "u_cam"), cam);
  gl.uniform3fv(gl.getUniformLocation(birdProg, "u_fog"), fog);
  gl.uniform3f(gl.getUniformLocation(birdProg, "u_color"), 0.045, 0.042, 0.038);
  gl.bindVertexArray(birdVAO);
  gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, N);

  gl.bindBuffer(gl.ARRAY_BUFFER, predBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, predInst);
  gl.uniform3f(gl.getUniformLocation(birdProg, "u_color"), 0.02, 0.02, 0.018);
  gl.bindVertexArray(predVAO);
  gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 1);
  gl.bindVertexArray(null);
}

function frameLoop(now) {
  const dt = Math.min(0.033, (now - last) / 1000 || 0.016);
  last = now;
  step(dt);
  draw();
  requestAnimationFrame(frameLoop);
}

let last = performance.now();
resize();
window.addEventListener("resize", resize);

const startAt = Math.max(0, parseFloat(new URLSearchParams(location.search).get("t")) || 0);
if (startAt > 0.5) {
  const u0 = (startAt % CYCLE) / CYCLE;
  if (pullOf(u0) > 0.8) {
    for (let i = 0; i < N; i++) {
      px[i] = tx[i];
      py[i] = ty[i];
      pz[i] = tz[i];
      vx[i] = 0;
      vy[i] = 0;
      vz[i] = 0;
    }
    time = startAt;
    cenX = 0; cenY = DECK_Y; cenZ = 0;
  } else {
    const dt = 1 / 30;
    for (let t = 0; t < startAt; t += dt) step(dt);
  }
}

requestAnimationFrame(frameLoop);
</script>
